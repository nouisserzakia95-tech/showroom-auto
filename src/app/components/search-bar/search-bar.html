<section class="cars-section" id="cars">
    <h2 class="section-title">Our Cars</h2>

    <div class="header">
        <label>Search</label>
        <input type="text" #brand placeholder="Brand or model..." (input)="selectAutos(brand.value)">
        <fa-icon [icon]="faMagnifyingGlass" />
    </div>

    <div class="container">
        @for (auto of selectedAutos; track auto.id) {
            <div class="card">
                <div class="auto-card">
                    <img [src]="`images/${auto.photo}`" [alt]="auto.model">

                    <div class="details">
                        <h3>{{ auto.brand }} {{ auto.model }}</h3>

                        <p>
                            Year : {{ auto.year }}<br>
                            Color : {{ auto.color }}<br>
                            Power : {{ auto.power }}<br>
                            Price : {{ auto.price }}<br>
                            Only {{ auto.availability }} units in stock
                        </p>
                    </div>
                    <div class="see_more">
                        <button (click)="selectCar(auto)">See more</button>
                    </div>
                </div>
            </div>
        }
    </div>

    @if (selectedAutos.length === 0) {
        <p class="no-result">No car found.</p>
    }
</section>
