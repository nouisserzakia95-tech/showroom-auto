<app-head-bar></app-head-bar>
<app-home></app-home>
<app-search-bar [autos]="autoList" (onSelectCar)="selectCar($event)"></app-search-bar>
@if (selectedCar) {
  <div class="overlay" (click)="closeCar()">
    <section class="car-detail" (click)="$event.stopPropagation()">
      <img [src]="`images/${selectedCar.photo}`" [alt]="selectedCar.model">

      <h2>{{ selectedCar.brand }} {{ selectedCar.model }}</h2>

      <p class="specs">
        Year : {{ selectedCar.year }}<br>
        Color : {{ selectedCar.color }}<br>
        Power : {{ selectedCar.power }}<br>
        Price : {{ selectedCar.price }}<br>
        Only {{ selectedCar.availability }} units in stock
      </p>

      <p class="description">{{ selectedCar.description }}</p>

      <button (click)="closeCar()">Close</button>
    </section>
  </div>
}

<app-footer></app-footer>
